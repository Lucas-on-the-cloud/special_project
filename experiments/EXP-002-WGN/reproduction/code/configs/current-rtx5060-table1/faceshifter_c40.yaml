experiment: WGN_reproduction_faceshifter_c40_rtx5060ti
method: baseline
seed: 1024
data:
  root: C:/sp/data
  json: C:/sp/data/FaceForensics++-official.json
  image_size: 256
  compression: c40
  frames_per_real: 40
  frames_per_fake: 10
  manipulations: [FF-FSh]
model:
  backbone: mobilevit_s.cvnets_in1k
  pretrained: true
  gate_hidden_dim: 4
training:
  epochs: 25
  micro_batch_size: 32
  effective_batch_size: 32
  workers: 4
  cpu_threads: 4
  learning_rate: 0.0001
  weight_decay: 0.0
  precision: fp32

