experiment: wgn_ffpp_c23_paper_derived
seed: 1024

data:
  root: C:/sp1/data
  json: C:/sp1/data/FaceForensics++.json
  image_size: 256
  frames_per_real: 40
  frames_per_fake: 10
  manipulations: [FF-DF, FF-F2F, FF-FS, FF-NT]
  note: Existing processed data contains at most 32 frames per video, so real videos are capped at 32.

model:
  backbone: mobilevit_s.cvnets_in1k
  pretrained: true
  gate_hidden_dim: 4

training:
  epochs: 25
  batch_size: 32
  workers: 8
  optimizer: adam
  learning_rate: 0.0001
  weight_decay: 0.0
  scheduler: cosine
  precision: fp32
  output_dir: C:/sp1/WGN/runs/wgn_ffpp_c23

